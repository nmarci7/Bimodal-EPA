<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPA workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-name">EPA workbench</span><span class="brand-sub">engine v2 · TLA+ runs · ASP candidates</span></div>
  <label class="case-select"><span class="sr">Demo case</span><select id="case-select"><option value="">Open a demo case…</option></select></label>
  <nav class="tabs" aria-label="Workflow">
    <button data-view="model" class="tab active">1 Model</button>
    <button data-view="evidence" class="tab">2 Evidence</button>
    <button data-view="analysis" class="tab">3 Analysis</button>
    <button data-view="verdicts" class="tab">4 Verdicts</button>
  </nav>
  <div class="spacer"></div>
  <div class="actions">
    <button id="btn-new" class="btn">New</button>
    <button id="btn-import" class="btn" title="Import a model (YAML or JSON)">Import</button>
    <button id="btn-export" class="btn">Export YAML</button>
    <button id="btn-bootstrap" class="btn" title="Draft a model from traces and an MCP tools list">Bootstrap</button>
    <button id="btn-run" class="btn primary">Run analysis</button>
  </div>
  <input type="file" id="file-import" accept=".yaml,.yml,.json" hidden>
</header>
<div id="stagebar" class="stagebar" hidden></div>
<main id="views">
  <section id="view-model" class="view active"></section>
  <section id="view-evidence" class="view"></section>
  <section id="view-analysis" class="view"></section>
  <section id="view-verdicts" class="view"></section>
</main>
<div id="modal" class="modal" hidden><div class="modal-box" role="dialog" aria-modal="true"><button class="modal-close" aria-label="Close">×</button><div class="modal-body"></div></div></div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/web/app.js"></script>
</body>
</html>
