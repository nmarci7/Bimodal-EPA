<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#222">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="white"/>

  <!-- Analyst -->
  <rect x="40" y="175" width="160" height="80" rx="8" fill="#F4F4F4" stroke="#333" stroke-width="1.3"/>
  <circle cx="72" cy="203" r="8" fill="none" stroke="#333" stroke-width="1.3"/>
  <path d="M58,232 C58,218 86,218 86,232" fill="none" stroke="#333" stroke-width="1.3"/>
  <text x="140" y="211" text-anchor="middle" font-size="13" font-weight="bold">Analyst</text>
  <text x="140" y="229" text-anchor="middle" font-size="10" fill="#555">engineer / auditor</text>

  <!-- Company agentic workflow -->
  <rect x="330" y="35" width="330" height="120" rx="8" fill="white" stroke="#333" stroke-width="1.3"/>
  <text x="495" y="60" text-anchor="middle" font-size="13" font-weight="bold">Company agentic workflow</text>
  <text x="495" y="78" text-anchor="middle" font-size="10" fill="#555">LLM planner, tools, guards — in production</text>
  <rect x="348" y="96" width="140" height="40" rx="5" fill="#FAFAFA" stroke="#777" stroke-width="1"/>
  <text x="418" y="113" text-anchor="middle" font-size="10">CI · audits · reviews</text>
  <text x="418" y="127" text-anchor="middle" font-size="9" fill="#666">→ certificates</text>
  <rect x="502" y="96" width="140" height="40" rx="5" fill="#FAFAFA" stroke="#777" stroke-width="1"/>
  <text x="572" y="113" text-anchor="middle" font-size="10">logs · traces · statements</text>
  <text x="572" y="127" text-anchor="middle" font-size="9" fill="#666">→ witnesses</text>

  <!-- Tool container -->
  <rect x="300" y="230" width="560" height="190" rx="10" fill="#FCFCFC" stroke="#666" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="318" y="252" font-size="12" font-weight="bold" fill="#444">Tool</text>

  <!-- Reasoning engine -->
  <rect x="330" y="270" width="250" height="120" rx="8" fill="#EFEFEF" stroke="#333" stroke-width="1.3"/>
  <text x="455" y="297" text-anchor="middle" font-size="13" font-weight="bold">Reasoning engine</text>
  <text x="455" y="318" text-anchor="middle" font-size="10.5">candidates (epistemic, ASP)</text>
  <text x="455" y="334" text-anchor="middle" font-size="10.5">× runs (alethic, TLA+)</text>
  <text x="455" y="364" text-anchor="middle" font-size="10" font-style="italic" fill="#555">internals: Fig. 2</text>

  <!-- Verdict table -->
  <rect x="640" y="283" width="195" height="96" rx="8" fill="white" stroke="#333" stroke-width="1.8"/>
  <text x="737" y="306" text-anchor="middle" font-size="13" font-weight="bold">Verdict table</text>
  <text x="737" y="326" text-anchor="middle" font-size="10.5">per row: guarantee / hope /</text>
  <text x="737" y="341" text-anchor="middle" font-size="10.5">exposed / unchecked</text>
  <text x="737" y="361" text-anchor="middle" font-size="10" fill="#555">+ certify next · re-verify</text>

  <!-- engine -> verdicts -->
  <line x1="580" y1="330" x2="638" y2="330" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- 1: models -->
  <line x1="200" y1="188" x2="328" y2="88" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <g>
    <circle cx="104" cy="101" r="7" fill="white" stroke="#333" stroke-width="1"/>
    <text x="104" y="104" text-anchor="middle" font-size="8.5" font-weight="bold">1</text>
    <text x="116" y="104" font-size="10.5">models it: components, rules,</text>
    <text x="116" y="118" font-size="10.5">observation points, toleration</text>
  </g>

  <!-- 5: changes (closing the loop) -->
  <line x1="200" y1="215" x2="328" y2="122" stroke="#333" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <g>
    <circle cx="264" cy="187" r="7" fill="white" stroke="#333" stroke-width="1"/>
    <text x="264" y="190" text-anchor="middle" font-size="8.5" font-weight="bold">5</text>
    <text x="276" y="190" font-size="10.5">changes it: adds a guard,</text>
    <text x="276" y="204" font-size="10.5">orders an audit, adds logging</text>
  </g>

  <!-- 2: model + claims -->
  <line x1="200" y1="243" x2="328" y2="302" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <g>
    <circle cx="208" cy="304" r="7" fill="white" stroke="#333" stroke-width="1"/>
    <text x="208" y="307" text-anchor="middle" font-size="8.5" font-weight="bold">2</text>
    <text x="220" y="307" font-size="10.5">model + claims</text>
  </g>

  <!-- 3: evidence -->
  <line x1="495" y1="155" x2="495" y2="268" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <g>
    <circle cx="512" cy="189" r="7" fill="white" stroke="#333" stroke-width="1"/>
    <text x="512" y="192" text-anchor="middle" font-size="8.5" font-weight="bold">3</text>
    <text x="524" y="192" font-size="10.5">evidence, sourced and dated:</text>
    <text x="524" y="206" font-size="10.5">certificates — about every run of a rule</text>
    <text x="524" y="220" font-size="10.5">witnesses — one observed run each</text>
  </g>

  <!-- 4: verdicts back to analyst -->
  <path d="M737,379 L737,450 L120,450 L120,257" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
  <g>
    <circle cx="338" cy="439" r="7" fill="white" stroke="#333" stroke-width="1"/>
    <text x="338" y="442" text-anchor="middle" font-size="8.5" font-weight="bold">4</text>
    <text x="350" y="442" font-size="10.5">verdicts per row, what to certify next, what to re-verify</text>
  </g>
</svg>
